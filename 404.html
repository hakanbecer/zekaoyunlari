<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı | Akıl ve Zekâ Oyunları</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 32px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🧩</div>
    <h1>Sayfa Bulunamadı</h1>
    <p>Aradığınız oyun veya sayfa taşınmış ya da mevcut olmayabilir. Tüm oyunlara ana sayfamız üzerinden kolayca erişebilirsiniz.</p>
    <a href="./index.html" class="btn">
      <span>🏠</span>
      <span>Ana Sayfaya Dön</span>
    </a>
  </div>
</body>
</html>
